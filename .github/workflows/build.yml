name: Build LiveContainer + DeviceSpoof

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: List available Xcodes
        run: |
          ls -la /Applications | grep -i xcode || true
          find /Applications -maxdepth 4 -name "iPhoneOS*.sdk" -type d 2>/dev/null || true
      - name: Select Xcode
        run: |
          for X in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode_16.1.app Xcode_16.0.app Xcode.app; do
            if [ -d "/Applications/$X" ]; then
              sudo xcode-select -s "/Applications/$X"
              if xcodebuild -showsdks 2>/dev/null | grep -q iphoneos; then
                echo "USING: $X"; break
              fi
            fi
          done
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true
      - name: Install tools
        run: brew install ldid || true

      - name: Fix OpenSSL xcframework
        run: |
          set -x
          XCF="OpenSSL/Frameworks/OpenSSL.xcframework"
          
          # 1) 查看结构
          find "$XCF" -type f | head -20
          
          # 2) 删除所有签名
          find "$XCF" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$XCF" -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true
          
          # 3) 逐个重签（ad-hoc）
          for f in $(find "$XCF" -type f -perm +111); do
            echo "sign: $f"
            codesign --force --deep --sign - "$f" 2>&1 | head -2
          done
          
          # 4) 验证
          for f in $(find "$XCF" -type f -perm +111); do
            codesign -v "$f" 2>&1 | head -1
          done
          
          echo "=== fixed ==="

      - name: Clean derived data
        run: rm -rf ./build

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            -archivePath ./build/LC.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            -disableAutomaticPackageResolution=false \
            archive \
            2>&1 | tee /tmp/b.log
          # 只显示关键行
          grep -E "error:|warning: .*deprecated|BUILD FAILED|ARCHIVE" /tmp/b.log | head -60 || true

      - name: Locate
        if: always()
        run: |
          find ./build -name "*.xcarchive" -maxdepth 3 -type d 2>/dev/null
          find ./build -name "LiveContainer.app" -type d 2>/dev/null | head -3

      - name: Package
        run: |
          APP=$(find ./build -path "*.xcarchive/Products/Applications/LiveContainer.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then APP=$(find ./build -name "LiveContainer.app" -type d 2>/dev/null | head -1); fi
          if [ -z "$APP" ]; then echo "::error::App not found"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr LiveContainer_Patched.ipa Payload
          ls -la LiveContainer_Patched.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-Patched
          path: LiveContainer_Patched.ipa
          retention-days: 30

  # ============================================================
  #  v48: standalone tweak dylib (for injecting into genuine Kwai, no LC)
  # ============================================================
  build-tweak:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for X in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode_16.1.app Xcode_16.0.app Xcode.app; do
            if [ -d "/Applications/$X" ]; then
              sudo xcode-select -s "/Applications/$X"
              if xcodebuild -showsdks 2>/dev/null | grep -q iphoneos; then
                echo "USING: $X"; break
              fi
            fi
          done
          xcodebuild -version

      - name: Build standalone KwaiTweak dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          xcrun --sdk iphoneos clang \
            -arch arm64 -target arm64-apple-ios14.0 -isysroot "$SDK" \
            -I TweakLoader -I litehook/src -I litehook/external/include \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            -framework Security -framework LocalAuthentication \
            -framework UniformTypeIdentifiers -framework UserNotifications \
            -Wl,-no_fixup_chains \
            -dynamiclib -install_name @executable_path/Frameworks/KwaiTweak.dylib \
            -Wl,-undefined,dynamic_lookup -fobjc-arc -O2 \
            -Wno-deprecated-declarations -Wno-arc-performSelector-leaks \
            -o KwaiTweak.dylib \
            TweakLoader/KwaiStandaloneEntry.m \
            TweakLoader/KwaiBuiltin.m \
            TweakLoader/litehook.c
          echo "=== built ==="
          ls -l KwaiTweak.dylib
          xcrun --sdk iphoneos lipo -info KwaiTweak.dylib || true
          echo "=== defined litehook symbols ==="
          xcrun --sdk iphoneos nm -gU KwaiTweak.dylib 2>/dev/null | grep -i litehook || echo "(none exported)"
          echo "=== undefined litehook refs (should be empty) ==="
          xcrun --sdk iphoneos nm -u KwaiTweak.dylib 2>/dev/null | grep -i litehook || echo "(none undefined = good)"

      - uses: actions/upload-artifact@v4
        with:
          name: KwaiTweak-dylib
          path: KwaiTweak.dylib
          retention-days: 30

  # ============================================================
  #  v48b: standalone five-params extractor dylib (no LC, no litehook)
  # ============================================================
  build-five:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for X in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode_16.1.app Xcode.app; do
            if [ -d "/Applications/$X" ]; then
              sudo xcode-select -s "/Applications/$X"
              if xcodebuild -showsdks 2>/dev/null | grep -q iphoneos; then
                echo "USING: $X"; break
              fi
            fi
          done
          xcodebuild -version

      - name: Build KwaiFiveParams dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          xcrun --sdk iphoneos clang \
            -arch arm64 -target arm64-apple-ios14.0 -isysroot "$SDK" \
            -I TweakLoader \
            -framework Foundation -framework UIKit -framework Security \
            -dynamiclib -install_name @executable_path/Frameworks/KwaiFiveParams.dylib \
            -Wl,-undefined,dynamic_lookup -fobjc-arc -O2 \
            -Wno-deprecated-declarations -Wno-arc-performSelector-leaks \
            -o KwaiFiveParams.dylib \
            TweakLoader/KwaiFiveParams.m
          echo "=== built ==="
          ls -l KwaiFiveParams.dylib
          xcrun --sdk iphoneos lipo -info KwaiFiveParams.dylib || true
          echo "=== non-system dylib deps (should be empty) ==="
          otool -L KwaiFiveParams.dylib | tail -n +2 | grep -v '/System/Library' || echo "(none = good)"
          echo "=== key symbols ==="
          xcrun --sdk iphoneos nm -gU KwaiFiveParams.dylib | grep -iE 'FiveParams|FiveString' || true

      - uses: actions/upload-artifact@v4
        with:
          name: KwaiFiveParams-dylib
          path: KwaiFiveParams.dylib
          retention-days: 30

  # ============================================================
  #  v48c: KwaiFiveOnly — authorization stripped, five-params kept
  # ============================================================
  build-fiveonly:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for X in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode_16.1.app Xcode.app; do
            if [ -d "/Applications/$X" ]; then
              sudo xcode-select -s "/Applications/$X"
              if xcodebuild -showsdks 2>/dev/null | grep -q iphoneos; then
                echo "USING: $X"; break
              fi
            fi
          done
          xcodebuild -version

      - name: Build KwaiFiveOnly dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          xcrun --sdk iphoneos clang \
            -arch arm64 -target arm64-apple-ios14.0 -isysroot "$SDK" \
            -I TweakLoader -I litehook/src -I litehook/external/include \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            -framework Security -framework LocalAuthentication \
            -framework UniformTypeIdentifiers -framework UserNotifications \
            -Wl,-no_fixup_chains \
            -dynamiclib -install_name @executable_path/Frameworks/KwaiFiveOnly.dylib \
            -Wl,-undefined,dynamic_lookup -fobjc-arc -O2 \
            -Wno-deprecated-declarations -Wno-arc-performSelector-leaks \
            -o KwaiFiveOnly.dylib \
            TweakLoader/KwaiFiveOnlyEntry.m \
            TweakLoader/KwaiFiveOnly.m \
            TweakLoader/litehook.c
          echo "=== built ==="
          ls -l KwaiFiveOnly.dylib
          xcrun --sdk iphoneos lipo -info KwaiFiveOnly.dylib || true
          echo "=== auth symbols must be ABSENT (expect none) ==="
          xcrun --sdk iphoneos nm -gU KwaiFiveOnly.dylib | grep -iE 'Deliver|OrderVC|sendReq|canOpenURL|ShowOrderList|HTTPGet' || echo "(clean)"
          echo "=== five-params symbols must be PRESENT ==="
          xcrun --sdk iphoneos nm -gU KwaiFiveOnly.dylib | grep -iE 'FiveParams|FiveString|FiveBall|FivePanel' || echo "(MISSING!)"
          echo "=== __mod_init_func must exist (needed by dyld to run constructor) ==="
          otool -l KwaiFiveOnly.dylib | grep -A3 -E '__mod_init_func|__init_offsets' || echo "(neither found)"
          echo "=== code signature ==="
          codesign -dv KwaiFiveOnly.dylib 2>&1 | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: KwaiFiveOnly-dylib
          path: KwaiFiveOnly.dylib
          retention-days: 30
name: Build LiveContainer + DeviceSpoof

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          brew install ldid xz

      - name: Build LiveContainer
        run: |
          xcodebuild \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            -archivePath ./build/LiveContainer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive 2>&1 | tail -60

      - name: Locate archive
        run: |
          find ./build -name "*.xcarchive" -type d
          find ./build -name "LiveContainer.app" -type d

      - name: Package IPA
        run: |
          APP=$(find ./build -path "*.xcarchive/Products/Applications/LiveContainer.app" -type d | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ./build -name "LiveContainer.app" -type d | head -1)
          fi
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 基础签名
          find Payload -name "*.dylib" -exec ldid -S {} \; 2>/dev/null || true
          ldid -S Payload/LiveContainer.app/LiveContainer 2>/dev/null || true
          zip -qr LiveContainer_Patched.ipa Payload
          ls -la LiveContainer_Patched.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-Patched
          path: LiveContainer_Patched.ipa
          retention-days: 30
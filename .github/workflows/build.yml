name: Build LiveContainer + DeviceSpoof

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          for X in Xcode_16.2.app Xcode_16.1.app Xcode_16.0.app Xcode.app; do
            if [ -d "/Applications/$X" ]; then sudo xcode-select -s "/Applications/$X"; break; fi
          done
          xcodebuild -version

      - name: Install tools
        run: brew install ldid || true

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer 2>&1 | tail -10 || true

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            -archivePath ./build/LC.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            archive \
            2>&1 | tail -100

      - name: Locate
        if: always()
        run: |
          echo "=== build 目录 ==="
          ls -la ./build 2>/dev/null || echo "build 不存在"
          echo "=== xcarchive ==="
          find ./build -name "*.xcarchive" -maxdepth 3 -type d 2>/dev/null
          echo "=== LiveContainer.app ==="
          find ./build -name "LiveContainer.app" -type d 2>/dev/null | head -3

      - name: Package
        run: |
          APP=$(find ./build -path "*.xcarchive/Products/Applications/LiveContainer.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ./build -name "LiveContainer.app" -type d 2>/dev/null | head -1)
          fi
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "::error::App not found"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr LiveContainer_Patched.ipa Payload
          ls -la LiveContainer_Patched.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-Patched
          path: LiveContainer_Patched.ipa
          retention-days: 30